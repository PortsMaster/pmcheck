[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pmcheck"
version = "0.2.5"
description = "Static packaging checker for PortMaster ports"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["Pillow"]

[project.optional-dependencies]
bot = ["discord.py>=2.3", "aiohttp>=3.9"]

[project.scripts]
pmcheck = "pmcheck.__main__:main"

[tool.setuptools]
packages = ["pmcheck"]

[tool.setuptools.package-data]
pmcheck = ["g2keys.json", "prompt/rules.md", "prompt/reference.md"]
